[project]
name = "regexbench"
version = "0.2.0"
description = "Evaluate generated regular expressions: semantic equivalence, correctness, and ReDoS safety."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Foothills Labs" }]
keywords = ["regex", "evaluation", "benchmark", "redos", "llm", "automata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
regexbench = "regexbench.cli:main"

[project.urls]
Homepage = "https://github.com/foothills-labs/regexbench"
Repository = "https://github.com/foothills-labs/regexbench"
Issues = "https://github.com/foothills-labs/regexbench/issues"
Documentation = "https://github.com/foothills-labs/regexbench/blob/main/docs/benchmarks.md"
Changelog = "https://github.com/foothills-labs/regexbench/blob/main/CHANGELOG.md"

[build-system]
# hatchling 1.27 is the floor for PEP 639: below it, `license = "Apache-2.0"`
# is not read as an SPDX expression and the wheel gets Metadata 2.1.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regexbench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

[tool.pytest.ini_options]
# Collect the package too, so the README-facing examples in docstrings are
# executed. A doctest that drifts from the code is documentation that lies.
testpaths = ["tests", "src"]
addopts = "--strict-markers --doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
