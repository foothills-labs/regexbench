name: CI

on:
  push:
  pull_request:

# A branch and its pull request share a group, so opening a PR does not run
# the same commit twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is deliberately absent: CPython gh-124130 made \B match the
        # empty string, so `re` and this engine disagree there. Add it back
        # with the boundary model made version-aware.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
